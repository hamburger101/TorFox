# Continuous integration. Windows builds and tests on every push to main and
# on PRs. macOS (10x minute cost on private repos) runs on PRs and manual
# dispatch only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache verified dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-windows64-minimal-${{ hashFiles('deps.lock.json') }}

      - name: Fetch CEF (hash-verified)
        run: python -I scripts/fetch_deps.py cef windows64-minimal

      - name: Fetch libraries (hash-verified)
        shell: bash
        run: |
          python -I scripts/fetch_deps.py nlohmann_json header
          python -I scripts/fetch_deps.py googletest source
          python -I scripts/fetch_deps.py sqlite source
          python -I scripts/fetch_deps.py tor windows-x86_64

      - name: Install UI dependencies (lockfile, no install scripts)
        run: npm --prefix ui ci

      - name: Configure release and test builds
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $line = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productLineVersion
          $ver = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "Visual Studio product line: $line ($ver); CMake: $(cmake --version | Select-Object -First 1)"
          switch ("$ver".Split('.')[0]) {
            '18' { $gen = 'Visual Studio 18 2026' }
            '17' { $gen = 'Visual Studio 17 2022' }
            default { throw "Unsupported or missing Visual Studio: '$line' ($ver)" }
          }
          cmake -S . -B out/dev -G $gen -A x64 -DTORFOX_CEF_FLAVOR=minimal
          cmake -S . -B out/test -G $gen -A x64 -DTORFOX_CEF_FLAVOR=minimal -DTORFOX_TEST_HOOKS=ON

      - name: Build
        run: |
          cmake --build out/dev --config Release --parallel
          cmake --build out/test --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir out/test -C Release --output-on-failure

      - name: End-to-end tests (test build)
        working-directory: tests/e2e
        env:
          TORFOX_QUIET_SECONDS: "60"
        run: python -m unittest -v test_isolation test_bridge test_internal_pages test_settings test_lifecycle test_stage1_defaults test_quiet_startup test_browsing test_places test_private test_downloads test_privacy test_tor test_startup

      # The bundled tor itself (needs the network; LiveTorTest is skipped,
      # not failed, if tor cannot finish bootstrapping from the runner).
      - name: Tor tests with the bundled tor (network)
        working-directory: tests/e2e
        env:
          TORFOX_LIVE_TESTS: "1"
        run: python -m unittest -v test_tor.RealTorTest test_tor.RealTorNonAsciiProfileTest test_tor.LiveTorTest

      - name: Release-build platform tests (sandbox, command line)
        run: python -m unittest discover -v -s tests/platform -p "test_*_win.py"

  macos:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cef: macosarm64-minimal
            tor: macos-aarch64
            arch: arm64
          - runner: macos-15-intel
            cef: macosx64-minimal
            tor: macos-x86_64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache verified dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ matrix.cef }}-${{ hashFiles('deps.lock.json') }}

      - name: Fetch CEF (hash-verified)
        run: python3 -I scripts/fetch_deps.py cef ${{ matrix.cef }}

      - name: Fetch libraries (hash-verified)
        run: |
          python3 -I scripts/fetch_deps.py nlohmann_json header
          python3 -I scripts/fetch_deps.py googletest source
          python3 -I scripts/fetch_deps.py sqlite source
          python3 -I scripts/fetch_deps.py tor ${{ matrix.tor }}

      - name: Install UI dependencies (lockfile, no install scripts)
        run: npm --prefix ui ci

      - name: Ensure Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake -S . -B out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DTORFOX_CEF_FLAVOR=minimal

      - name: Build app and unit tests
        run: cmake --build out/ci --parallel

      - name: Unit tests
        run: ctest --test-dir out/ci --output-on-failure

      - name: Bundle layout
        run: |
          app="out/ci/src/browser/Release/TorFox.app"
          test -x "$app/Contents/MacOS/TorFox"
          test -d "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          for h in "" " (Alerts)" " (GPU)" " (Plugin)" " (Renderer)"; do
            test -x "$app/Contents/Frameworks/TorFox Helper$h.app/Contents/MacOS/TorFox Helper$h"
          done
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/Helpers/tor/tor"
          test -x "$app/Contents/Helpers/tor/pluggable_transports/lyrebird"
          test -f "$app/Contents/Helpers/tor/pluggable_transports/pt_config.json"
          test -f "$app/Contents/Helpers/tor/data/geoip"
